services:
  ns-checker:
    image: ghcr.io/truegenny/ns-checker-webapp:latest
    container_name: ns-checker
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

services:
  ns-checker:
    build: .
    image: ns-checker:latest
    container_name: ns-checker
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

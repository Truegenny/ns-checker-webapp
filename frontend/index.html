<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NS Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2e3247;
      --accent:   #4f8ef7;
      --accent2:  #6ee7b7;
      --text:     #e2e8f0;
      --muted:    #8892a4;
      --ok:       #22c55e;
      --err:      #ef4444;
      --warn:     #f59e0b;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent); }
    header p  { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      width: 100%;
      max-width: 860px;
      margin-bottom: 24px;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(79,142,247,0.06);
    }
    #drop-zone svg { color: var(--accent); margin-bottom: 12px; }
    #drop-zone p   { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    #drop-zone strong { color: var(--text); }
    #file-input { display: none; }

    #file-name {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--accent2);
      min-height: 18px;
    }

    /* Button */
    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 18px;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: 0.88; }

    #download-btn {
      background: var(--accent2);
      color: #0f1117;
      display: none;
    }

    /* Progress */
    #progress-section { display: none; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-bar-wrap {
      background: var(--border);
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 0%;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stat span { font-weight: 700; font-size: 1.1rem; margin-right: 4px; }
    .stat.ok span   { color: var(--ok); }
    .stat.err span  { color: var(--err); }
    .stat.warn span { color: var(--warn); }

    /* Results table */
    #results-section { display: none; }
    #results-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    thead th {
      background: #13162080;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      text-align: left;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 10px 14px; vertical-align: top; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }

    .ns-list { color: var(--muted); font-size: 0.82rem; line-height: 1.6; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-ok   { background: rgba(34,197,94,0.15);  color: var(--ok); }
    .badge-err  { background: rgba(239,68,68,0.15);  color: var(--err); }
    .badge-warn { background: rgba(245,158,11,0.15); color: var(--warn); }

    .error-msg {
      color: var(--err);
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1><span>NS</span> Checker</h1>
  <p>Upload a CSV with domains in column A — get their nameservers in seconds.</p>
</header>

<!-- Upload card -->
<div class="card">
  <div id="drop-zone">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
    </svg>
    <strong>Drop your CSV here</strong>
    <p>or click to browse — domains must be in column A</p>
    <input type="file" id="file-input" accept=".csv" />
  </div>

  <div id="file-name"></div>
  <div id="error-msg" class="error-msg"></div>

  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
    <button id="submit-btn" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      Check Nameservers
    </button>
    <button id="download-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
      Download Excel
    </button>
  </div>
</div>

<!-- Progress card -->
<div class="card" id="progress-section">
  <div class="progress-label">
    <span id="progress-text">Starting…</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
  <div class="stats" id="stats-row"></div>
</div>

<!-- Results card -->
<div class="card" id="results-section">
  <h2>Results</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Domain</th>
          <th>Nameservers</th>
          <th>Count</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="results-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const fileNameEl = document.getElementById('file-name');
  const submitBtn  = document.getElementById('submit-btn');
  const downloadBtn= document.getElementById('download-btn');
  const errorMsg   = document.getElementById('error-msg');
  const progressSec= document.getElementById('progress-section');
  const resultsSec = document.getElementById('results-section');
  const progressText= document.getElementById('progress-text');
  const progressPct = document.getElementById('progress-pct');
  const progressFill= document.getElementById('progress-fill');
  const statsRow   = document.getElementById('stats-row');
  const resultsTbody= document.getElementById('results-tbody');

  let selectedFile = null;
  let currentJobId = null;

  // Drop zone interactions
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

  function setFile(f) {
    selectedFile = f;
    fileNameEl.textContent = `Selected: ${f.name}  (${(f.size / 1024).toFixed(1)} KB)`;
    submitBtn.disabled = false;
    hideError();
    downloadBtn.style.display = 'none';
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function hideError() { errorMsg.style.display = 'none'; }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    hideError();
    submitBtn.disabled = true;
    downloadBtn.style.display = 'none';
    progressSec.style.display = 'block';
    resultsSec.style.display = 'none';
    resultsTbody.innerHTML = '';
    statsRow.innerHTML = '';
    setProgress(0, 0);

    const formData = new FormData();
    formData.append('file', selectedFile);

    let res;
    try {
      res = await fetch('/api/upload', { method: 'POST', body: formData });
    } catch (e) {
      showError('Network error uploading file.');
      submitBtn.disabled = false;
      return;
    }

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      showError(body.detail || 'Upload failed.');
      submitBtn.disabled = false;
      return;
    }

    const { job_id, total } = await res.json();
    currentJobId = job_id;
    listenForProgress(job_id, total);
  });

  function setProgress(done, total) {
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressPct.textContent  = pct + '%';
    progressText.textContent = total > 0
      ? `Checking nameservers… ${done} / ${total}`
      : 'Starting…';
  }

  function listenForProgress(jobId, total) {
    const es = new EventSource(`/api/status/${jobId}`);

    es.onmessage = e => {
      const data = JSON.parse(e.data);
      setProgress(data.progress, data.total || total);

      if (data.status === 'done') {
        es.close();
        setProgress(data.total, data.total);
        progressText.textContent = 'Complete!';
        renderResults(data.results);
        submitBtn.disabled = false;
      } else if (data.status === 'error') {
        es.close();
        showError(data.error || 'Processing error.');
        progressSec.style.display = 'none';
        submitBtn.disabled = false;
      }
    };

    es.onerror = () => {
      es.close();
      showError('Lost connection to server.');
      submitBtn.disabled = false;
    };
  }

  function badgeClass(status) {
    if (status === 'OK') return 'badge-ok';
    if (['NXDOMAIN','TIMEOUT','NO_NS_RECORD'].includes(status) || status.startsWith('ERROR'))
      return 'badge-err';
    return 'badge-warn';
  }

  function renderResults(results) {
    resultsSec.style.display = 'block';
    downloadBtn.style.display = 'inline-flex';

    let ok = 0, err = 0, warn = 0;

    resultsTbody.innerHTML = results.map((r, i) => {
      const bc = badgeClass(r.status);
      if (bc === 'badge-ok')   ok++;
      else if (bc === 'badge-err')  err++;
      else warn++;

      const nsList = r.nameservers.length
        ? r.nameservers.map(ns => `<div>${ns}</div>`).join('')
        : '<span style="color:var(--err)">—</span>';

      return `<tr>
        <td style="color:var(--muted)">${i + 1}</td>
        <td><strong>${esc(r.domain)}</strong></td>
        <td><div class="ns-list">${nsList}</div></td>
        <td style="text-align:center">${r.ns_count || '—'}</td>
        <td><span class="badge ${bc}">${esc(r.status)}</span></td>
      </tr>`;
    }).join('');

    statsRow.innerHTML = `
      <div class="stat ok"><span>${ok}</span> OK</div>
      <div class="stat err"><span>${err}</span> Failed</div>
      ${warn ? `<div class="stat warn"><span>${warn}</span> Skipped</div>` : ''}
      <div class="stat"><span>${results.length}</span> Total</div>
    `;
  }

  downloadBtn.addEventListener('click', () => {
    if (currentJobId) window.location.href = `/api/download/${currentJobId}`;
  });

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
